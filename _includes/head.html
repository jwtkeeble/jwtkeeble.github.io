{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // Set dark mode as default before CSS loads to avoid flash
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "light") {
    // Keep light if explicitly saved
  } else {
    // Default to dark (also covers null/undefined)
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
